name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for Trusted Publisher (npm OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # 実物の RFC を数本取りに行く（rfc-editor.org / datatracker）。1 分程度。
      # audit / crosscheck / snapshot は取得が多いので audit.yml（週次・手動）に置く。
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"

      # Trusted Publisher requires npm >= 11.5.1, but Node 22 ships with npm 10.x.
      # `npm install -g npm@latest` is known to fail intermittently on GitHub Actions
      # runners (self-overwrite race), so we invoke a fresh npm via npx only for
      # this step. No NODE_AUTH_TOKEN needed: authentication is performed via OIDC
      # token exchange with npm Trusted Publisher.
      - name: Publish to npm
        run: npx -y npm@latest publish --provenance --access public
